services:
  vps-monitor:
    image: samochu/vps-monitor:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vps-monitor
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
      - ./data:/data
    environment:
      HOST_ROOT: /host
    mem_limit: 256m
    cpus: 1.0
